services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pp1875
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pp1875"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: &backend-build
      context: ./backend
      additional_contexts:  # локальные кэши для быстрой сборки; пустые папки — всё качается из интернета
        hfseed: ./.hf
        pipseed: ./wheels/cpu
      args:  # модель берётся из .env; папка /data/models/... не качается, а подключается томом ./data
        EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
    image: pp1875-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/pp1875
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data:ro
      - uploads:/uploads
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Только с этого компьютера (Swagger на localhost:8000/docs); снаружи API доступен лишь через web
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: *backend-build
    image: pp1875-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/pp1875
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data:ro
      - uploads:/uploads
    command: sh -c "python -m app.seed && celery -A app.celery_app worker --loglevel=info --concurrency=1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        # VITE_USE_MOCKS=true docker compose up --build — сайт на заглушках, пока на backend нет API
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    image: pp1875-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
