# Сайт открыт в интернет (домашний сервер) — ограничиваем частоту запросов к API с одного адреса.
# Если перед nginx стоит туннель/другой прокси, $binary_remote_addr будет адресом прокси:
# тогда настроить real_ip (set_real_ip_from + real_ip_header) под конкретный туннель.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=heavy:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker DNS: адрес api ищется при каждом запросе, поэтому nginx стартует,
    # даже если backend ещё не поднялся, и переживает его перезапуск (пока api недоступен — 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    client_max_body_size 20m;      # загрузка Excel/CSV и редакций НПА
    limit_req_status 429;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Тяжёлые запросы: пакет до 100 товаров и загрузка новой редакции НПА
    location ~ ^/api/(classify/batch|npa/upload)$ {
        limit_req zone=heavy burst=3 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Кэш задаём через expires, а не add_header: add_header внутри location отменил бы заголовки безопасности выше.
    # Сборка Vite кладёт файлы с хешем в имени — их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html; сам index.html не кэшируем, чтобы обновления доходили сразу
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
